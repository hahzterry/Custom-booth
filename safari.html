<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <title>LUMEE BOOTH Photobooth</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050508;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', 'Segoe UI', sans-serif;
      padding: 24px;
    }
    .container {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .logo {
      display: inline-flex;
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: linear-gradient(135deg, #7c3aed, #db2777);
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 16px 48px rgba(124,58,237,0.45);
      font-size: 32px;
      color: #fff;
      font-weight: 700;
    }
    h1 {
      color: #fff;
      font-size: 32px;
      font-weight: 800;
      margin: 0 0 8px;
      letter-spacing: -1px;
    }
    p {
      color: rgba(255,255,255,0.6);
      font-size: 16px;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .btn {
      display: block;
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #7c3aed, #db2777);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      line-height: 52px;
      margin-bottom: 12px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.7);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.15); }
    .features {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 20px;
      color: rgba(255,255,255,0.3);
      font-size: 13px;
    }
    .features span {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-green { background: #22c55e; }
    .dot-blue { background: #3b82f6; }
    .dot-purple { background: #a78bfa; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">📷</div>
    <h1>LUMEE BOOTH</h1>
    <p>Your event. Your photobooth. Create a personalised booth for your party, wedding, or event.</p>

    <a href="./" class="btn">Enter Photobooth</a>
    <a href="./settings.html" class="btn btn-secondary">Event Setup</a>

    <div class="features">
      <span><span class="dot dot-green"></span> HD Video</span>
      <span><span class="dot dot-blue"></span> Photo Strip</span>
      <span><span class="dot dot-purple"></span> Live Chat</span>
    </div>
  </div>
</body>
</html>
